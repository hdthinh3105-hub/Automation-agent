services:
  # ── Infrastructure ──
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: acs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_customer_support
    ports:
      - "5432:5432"
    volumes:
      - acs-postgres-data:/var/lib/postgresql/data
      - ./Automatio Agent BE/automation-agent/docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: acs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - acs-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend API ──
  api:
    build:
      context: ./Automatio Agent BE/automation-agent
      dockerfile: Dockerfile
    container_name: acs-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_customer_support?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
    ports:
      - "3000:3000"
    volumes:
      - acs-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Worker (BullMQ) ──
  worker:
    build:
      context: ./Automatio Agent BE/automation-agent
      dockerfile: Dockerfile.worker
    container_name: acs-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_customer_support?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - acs-storage:/app/storage
      - acs-transformers-cache:/app/.transformers-cache

  # ── Frontend ──
  frontend:
    build:
      context: ./Automation Agent FE/automation-agent-fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
    container_name: acs-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"

volumes:
  acs-postgres-data:
  acs-redis-data:
  acs-storage:
  acs-transformers-cache:
